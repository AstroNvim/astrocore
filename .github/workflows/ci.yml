name: AstroNvim
on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [opened, edited, synchronize]
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 8 * * 1"

env:
  TEST_ENVIRONMENT_SCHEMA: "3"
  TEST_ENVIRONMENT_CACHE_ROTATION: "1"

jobs:
  CI:
    uses: AstroNvim/.github/.github/workflows/plugin_ci.yml@main
    if: ${{ github.event_name != 'pull_request_target' }}
    secrets: inherit
    with:
      plugin_name: ${{ github.event.repository.name }}
      is_production: ${{ github.event_name == 'push' }}
  Tests:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NVIM_VERSION: "0.12.4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Neovim
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/nvim-linux-x86_64.tar.gz" \
            --output /tmp/nvim.tar.gz
          tar --extract --gzip --file /tmp/nvim.tar.gz --directory /tmp
          echo "/tmp/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/nvim-linux-x86_64/bin:$PATH"
          test "$(nvim --version | head -n 1)" = "NVIM v${NVIM_VERSION}"
      - name: Install test linters
        run: |
          cargo install stylua --version 2.5.2 --locked
          cargo install selene --version 0.31.0 --locked
      - name: Run test static checks
        run: |
          stylua --check tests
          selene tests
          git diff --check
          git diff --exit-code
      - name: Compute test environment fingerprint
        id: test-fingerprint
        run: echo "value=$(nvim -l tests/fingerprint.lua)" >> "$GITHUB_OUTPUT"
      - name: Restore test environment cache
        id: test-environment-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tests
          key: test-environment-${{ runner.os }}-${{ runner.arch }}-nvim-${{ env.NVIM_VERSION }}-schema-${{ env.TEST_ENVIRONMENT_SCHEMA }}-fingerprint-${{ steps.test-fingerprint.outputs.value }}-rotation-${{ env.TEST_ENVIRONMENT_CACHE_ROTATION }}
      - name: Prepare test environment
        run: |
          if ! make test-prepare; then
            make test-clear
            make test-prepare
          fi
      - name: Save test environment cache
        if: steps.test-environment-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tests
          key: test-environment-${{ runner.os }}-${{ runner.arch }}-nvim-${{ env.NVIM_VERSION }}-schema-${{ env.TEST_ENVIRONMENT_SCHEMA }}-fingerprint-${{ steps.test-fingerprint.outputs.value }}-rotation-${{ env.TEST_ENVIRONMENT_CACHE_ROTATION }}
      - name: Run full suite twice
        env:
          LAZY_OFFLINE: "1"
        run: |
          make test
          make test
      - name: Verify repository immutability
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  Semantic:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum supported
            os: ubuntu-latest
            neovim: v0.11.0
          - name: stable baseline
            os: ubuntu-latest
            neovim: v0.12.4
          - name: macOS smoke
            os: macos-latest
            neovim: v0.12.4
          - name: Windows smoke
            os: windows-latest
            neovim: v0.12.4
    name: Semantic Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NVIM_VERSION: ${{ matrix.neovim }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Verify Neovim version
        shell: bash
        run: test "$(nvim --version | head -n 1)" = "NVIM ${NVIM_VERSION}"
      - name: Install make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress --yes
      - name: Repository preflight
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Compute test environment fingerprint
        id: test-fingerprint
        shell: bash
        run: echo "value=$(nvim -l tests/fingerprint.lua)" >> "$GITHUB_OUTPUT"
      - name: Restore test environment cache
        id: test-environment-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tests
          key: test-environment-${{ runner.os }}-${{ runner.arch }}-nvim-${{ env.NVIM_VERSION }}-schema-${{ env.TEST_ENVIRONMENT_SCHEMA }}-fingerprint-${{ steps.test-fingerprint.outputs.value }}-rotation-${{ env.TEST_ENVIRONMENT_CACHE_ROTATION }}
      - name: Prepare test environment
        shell: bash
        run: |
          if ! make test-prepare; then
            make test-clear
            make test-prepare
          fi
      - name: Save test environment cache
        if: steps.test-environment-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tests
          key: test-environment-${{ runner.os }}-${{ runner.arch }}-nvim-${{ env.NVIM_VERSION }}-schema-${{ env.TEST_ENVIRONMENT_SCHEMA }}-fingerprint-${{ steps.test-fingerprint.outputs.value }}-rotation-${{ env.TEST_ENVIRONMENT_CACHE_ROTATION }}
      - name: Run semantic suite
        shell: bash
        env:
          LAZY_OFFLINE: "1"
        run: make test-semantic
      - name: Verify repository immutability
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  Nightly:
    name: Nightly Smoke
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NVIM_VERSION: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Neovim nightly
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: nightly
      - name: Repository preflight
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Compute test environment fingerprint
        id: test-fingerprint
        run: echo "value=$(nvim -l tests/fingerprint.lua)" >> "$GITHUB_OUTPUT"
      - name: Restore nightly test environment cache
        id: test-environment-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tests
          key: test-environment-nightly-${{ runner.os }}-${{ runner.arch }}-schema-${{ env.TEST_ENVIRONMENT_SCHEMA }}-fingerprint-${{ steps.test-fingerprint.outputs.value }}-rotation-${{ env.TEST_ENVIRONMENT_CACHE_ROTATION }}
      - name: Prepare test environment
        run: |
          if ! make test-prepare; then
            make test-clear
            make test-prepare
          fi
      - name: Save nightly test environment cache
        if: steps.test-environment-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tests
          key: test-environment-nightly-${{ runner.os }}-${{ runner.arch }}-schema-${{ env.TEST_ENVIRONMENT_SCHEMA }}-fingerprint-${{ steps.test-fingerprint.outputs.value }}-rotation-${{ env.TEST_ENVIRONMENT_CACHE_ROTATION }}
      - name: Run semantic smoke
        env:
          LAZY_OFFLINE: "1"
        run: make test-semantic
      - name: Verify repository immutability
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  Dependency-Refresh:
    name: Weekly Dependency Rebuild
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NVIM_VERSION: v0.12.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install stable Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ env.NVIM_VERSION }}
      - name: Verify Neovim version
        run: test "$(nvim --version | head -n 1)" = "NVIM ${NVIM_VERSION}"
      - name: Repository preflight
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Compute test environment fingerprint
        id: test-fingerprint
        run: echo "value=$(nvim -l tests/fingerprint.lua)" >> "$GITHUB_OUTPUT"
      - name: Rebuild test environment from current dependencies
        run: make test-update-deps
      - name: Save rebuilt environment
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tests
          key: test-environment-${{ runner.os }}-${{ runner.arch }}-nvim-${{ env.NVIM_VERSION }}-schema-${{ env.TEST_ENVIRONMENT_SCHEMA }}-fingerprint-${{ steps.test-fingerprint.outputs.value }}-rotation-${{ env.TEST_ENVIRONMENT_CACHE_ROTATION }}-weekly-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run full suite
        env:
          LAZY_OFFLINE: "1"
        run: make test
      - name: Verify repository immutability
        if: ${{ always() }}
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  PR:
    uses: AstroNvim/.github/.github/workflows/validate_pr.yml@main
    if: ${{ github.event_name == 'pull_request_target' }}
    secrets: inherit
